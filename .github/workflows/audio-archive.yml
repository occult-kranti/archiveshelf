name: Authorized audio archive

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum items per shard; 0 processes every indexed video"
        required: true
        default: "0"

permissions:
  contents: write
  actions: read

concurrency:
  group: authorized-audio-archive
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r worker/requirements-transcribe.txt
      - name: Verify one complete audio and transcript
        env:
          WHISPER_DOWNLOAD_ROOT: ${{ runner.temp }}/whisper-models
        run: python worker/audio_archive.py --csv inventory/videos.csv --output "$RUNNER_TEMP/smoke" --limit 1 --backend faster-whisper
      - uses: actions/upload-artifact@v4
        with:
          name: audio-smoke
          path: ${{ runner.temp }}/smoke
          retention-days: 2

  archive:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WHISPER_DOWNLOAD_ROOT: ${{ runner.temp }}/whisper-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r worker/requirements-transcribe.txt
      - name: Resume the previous shard when available
        run: |
          mkdir -p exports
          if gh release view audio-transcripts-v1 >/dev/null 2>&1; then
            gh release download audio-transcripts-v1 --pattern "audio-transcripts-shard-${{ matrix.shard }}.zip" --dir "$RUNNER_TEMP/resume" --clobber || true
            if [ -f "$RUNNER_TEMP/resume/audio-transcripts-shard-${{ matrix.shard }}.zip" ]; then
              unzip -q -o "$RUNNER_TEMP/resume/audio-transcripts-shard-${{ matrix.shard }}.zip" -d exports
            fi
          fi
      - name: Archive assigned videos
        run: python worker/audio_archive.py --csv inventory/videos.csv --output exports --shard-index ${{ matrix.shard }} --shard-count 4 --limit ${{ inputs.limit }} --backend faster-whisper
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: exports
          retention-days: 3

  aggregate:
    needs: archive
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: artifacts
          merge-multiple: false
      - name: Build verification tables and release archives
        run: python worker/aggregate_audio.py --artifacts artifacts --inventory inventory --release-dir release --expected-csv inventory/videos.csv
      - name: Publish audio and transcript release assets
        run: |
          if ! gh release view audio-transcripts-v1 >/dev/null 2>&1; then
            gh release create audio-transcripts-v1 --title "Authorized audio and transcript archive" --notes "Resumable per-video audio and transcript bundles. See inventory/AUDIO-STATUS.md for verification."
          fi
          gh release upload audio-transcripts-v1 release/*.zip --clobber
      - name: Commit verification tables
        run: |
          git config user.name "ArchiveShelf Automation"
          git config user.email "archiveshelf@example.invalid"
          git add inventory/AUDIO-STATUS.md inventory/audio-manifest.csv inventory/audio-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Update audio archive verification [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main; then
                break
              fi
              git pull --rebase origin main
            done
          fi
